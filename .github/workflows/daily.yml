name: Radnička hronika

on:
  workflow_dispatch:

  # Kada ručno menjaš kod/izvore i uradiš git push, odmah napravi novi deployment.
  # state/seen_urls.json nije u paths listi, pa botov commit state-a neće napraviti petlju.
  push:
    branches: ["main"]
    paths:
      - "main.py"
      - "sources.json"
      - "hidden_urls.txt"
      - "requirements.txt"
      - ".github/workflows/daily.yml"

  schedule:
    - cron: "35 7 * * *"
      timezone: "Europe/Belgrade"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radnicka-hronika
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v6

      - name: Podesi Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instaliraj biblioteke
        run: python -m pip install -r requirements.txt

      - name: Pokreni Radničku hroniku
        env:
          RADNICKA_HRONIKA_UA: "RadnickaHronika/0.3 (GitHub Actions)"
        run: |
          python main.py --timespan 14d --local-days 30 --maxrecords 75 --no-gdelt

      - name: Sačuvaj debug fajlove
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radnicka-hronika-debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Pripremi javnu stranicu
        run: |
          mkdir -p site
          cp out/report.html site/index.html
          cp out/latest.json site/latest.json
          touch site/.nojekyll

      # Čuva spisak već viđenih URL-ova u repozitorijumu.
      # Zato sledećeg dana samo stvarno novi članci dobijaju oznaku NOVO.
      - name: Sačuvaj stanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_urls.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Radnička hronika state [skip ci]"
            git push
          fi

      - name: Podesi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakuj stranicu za GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Objavi GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
